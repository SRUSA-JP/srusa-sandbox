name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # build が型検査・ESLint・配色のコントラスト検査を順に実行する
      - name: 型検査・lint・配色の検査とビルド
        run: npm run build

      - name: 実値の直書きが無いことを確認
        run: |
          if grep -rnoE '\b[a-z-]+-\[[^]]*\]' --include='*.tsx' src/ | grep -v 'var(--sr-'; then
            echo "::error::トークンを経由しない値が直書きされています（DESIGN.md を参照）"
            exit 1
          fi
