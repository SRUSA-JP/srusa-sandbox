name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # build が型検査・ESLint・UI初期レンダリング・配色/デザイン検査を順に実行する
      - name: 型検査・lint・UI/デザイン検査とビルド
        run: npm run build
